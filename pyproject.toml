[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkrun-dataset"
version = "0.1.0"
description = "Open-source parkrun data ingestion and reporting pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
parkrun-etl = "scripts.etl:main"
parkrun-query = "scripts.query:main"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "dashboard*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
